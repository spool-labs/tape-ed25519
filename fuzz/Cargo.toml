edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
ed25519-dalek = "2.1"
libfuzzer-sys = "0.4"
solana-ed25519 = "=0.2.4"
tape-ed25519 = { path = ".." }

[[bin]]
name = "any_bytes"
