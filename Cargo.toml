[package]
name = "tape-ed25519"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "BSD-3-Clause"
repository = "https://github.com/spool-labs/tapesvm"
description = "Ed25519 verification under the ZIP-215 rules, one signature at a time or eight lanes wide"

[lib]
doctest = false

[features]
default = []

[dependencies]
sha2 = { version = "0.11.0", default-features = false }
subtle = { version = "2.6.0", default-features = false, features = ["const-generics"] }
thiserror = { version = "2.0", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
cpufeatures = "0.3.0"
curve25519-dalek-derive = "0.1.1"

[[bench]]
name = "verify"
harness = false

[dev-dependencies]
criterion = "0.5"
ed25519-dalek = "2.1"
hex = "0.4"
proptest = "1.6"
rand = "0.10.2"
solana-ed25519 = "=0.2.4"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(curve25519_backend, values("simd"))']
